name: "nixcfg-next"
concurrency: "nixcfg-next"
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
jobs:
  "update":
    permissions:
      id-token: "write"
      contents: "write"
    runs-on: "ubuntu-24.04"
    outputs:
      next_git_ref: ${{ steps.update.outputs.next_git_ref }}
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: main
    - uses: "DeterminateSystems/determinate-nix-action@main"
      with:
        extra-conf: |
          extra-trusted-public-keys = cache.cum.navy-1:IFGBSHhUYM3c+2sJj0MMwcCG+9bOr5UahzdnPsV9JKA= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          extra-substituters = https://cache.cum.navy https://cache.numtide.com
          extra-trusted-substituters = https://cache.cum.navy https://cache.numtide.com
    - uses: "DeterminateSystems/magic-nix-cache-action@main"
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: prep
      run: nix shell nixpkgs#jujutsu -c ./.github/prep.sh
    - name: update
      id: update
      run: nix shell nixpkgs#jujutsu -c ./.github/update.sh
    - name: archive
      if: ${{ success() || failure() }}
      run: |
        set -x; set -euo pipefail
        ulimit -a
        nix flake archive
  "builds":
    needs: "update"
    uses: ./.github/workflows/build.yaml
    with:
      git_ref: ${{needs.update.outputs.next_git_ref}}
      key: main-next-wip
  "risky":
    needs: "update"
    uses: ./.github/workflows/risky.yaml
    with:
      git_ref: ${{needs.update.outputs.next_git_ref}}
      key: main-next-wip
