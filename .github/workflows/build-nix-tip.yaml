name: "nixcfg-build-nix-tip"
concurrency: "nixcfg-build-nix-tip-${{ inputs.key || github.head_ref || github.ref_name }}"
on:
  push:
    branches: [ "main" ]
  workflow_call:
    inputs:
      key:
        required: true
        type: string
      git_ref:
        required: true
        type: string
jobs:
  "builds":
    env:
      GIT_REF: ${{ inputs.git_ref || github.sha }}
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        runner:
        - "ubuntu-24.04"
        - "ubuntu-24.04-arm"
        - "macos-26"
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.GIT_REF }}
    - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
    - uses: "DeterminateSystems/determinate-nix-action@main"
      with:
        extra-conf: |
          extra-trusted-public-keys = cache.cum.navy-1:IFGBSHhUYM3c+2sJj0MMwcCG+9bOr5UahzdnPsV9JKA= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          extra-substituters = https://cache.cum.navy https://cache.numtide.com
          extra-trusted-substituters = https://cache.cum.navy https://cache.numtide.com
    - name: Upgrade determinate-nixd to latest
      run: |
        sudo determinate-nixd upgrade --tools branch/main --daemon branch/main
    - uses: "DeterminateSystems/magic-nix-cache-action@main"
    - name: build + cache
      if: ${{ success() || failure() }}
      run: |
        set -x; set -euo pipefail
        ulimit -a
        nix flake check --keep-going --build-all -L
    - name: Breakpoint if tests failed
      if: failure()
      uses: namespacelabs/breakpoint-action@18b8b1dc6ac651288cfffb20bee1a447632997a1 # v0.0.16
      with:
        duration: 30m
        authorized-users: edolstra
