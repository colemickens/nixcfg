name: "nixcfg-risky"
concurrency: "nixcfg-risky-${{ github.head_ref || github.ref_name }}"
on:
  push:
    branches: [ "main" ]
  workflow_call:
jobs:
  "builds":
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        runner:
        - "ubuntu-24.04"
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: "DeterminateSystems/determinate-nix-action@main"
    - uses: "DeterminateSystems/magic-nix-cache-action@main"
    - name: build + cache (jupitertwo)
      if: success() || failure()
      run: |
        nix build -L --keep-going \
          .#toplevels.jupitertwo
    - name: build + cache (jupitertwo) (dump)
      if: success() || failure()
      run: |
        set -x
        x="$(nix eval --raw .#toplevels.jupitertwo)"

        # but like, this shouldn't be needed, the step before DID SUCCEED ???
        echo $x
        nix build -j0 $x
        nix-store -q --graph $x
    - name: build + cache (riscv64 installer)
      if: success() || failure()
      run: |
        nix build -L --keep-going \
          .#extra.riscv64-linux.installer
    - name: build + cache (riscv64 iso bits)
      if: success() || failure()
      run: |
        nix build -L --keep-going \
          .#extra.riscv64-linux.installer-sdimage-bits
