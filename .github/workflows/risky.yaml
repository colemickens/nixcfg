name: "nixcfg-risky"
concurrency: "nixcfg-risky-${{ inputs.key || github.head_ref || github.ref_name }}"
on:
  # push:
  #   branches: [ "main" ]
  workflow_call:
    inputs:
      key:
        required: true
        type: string
      git_ref:
        required: true
        type: string
  workflow_dispatch:
jobs:
  "builds":
    env:
      GIT_REF: ${{ inputs.git_ref || github.sha }}
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        runner:
        - "ubuntu-24.04"
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.GIT_REF }}
    - uses: "DeterminateSystems/determinate-nix-action@main"
      with:
        extra-conf: |
          extra-trusted-public-keys = cache.cum.navy-1:IFGBSHhUYM3c+2sJj0MMwcCG+9bOr5UahzdnPsV9JKA=
          extra-substituters = https://cache.cum.navy
          extra-trusted-substituters = https://cache.cum.navy
    - uses: "DeterminateSystems/magic-nix-cache-action@main"
    - name: Breakpoint
      if: github.event_name == 'workflow_dispatch'
      uses: namespacelabs/breakpoint-action@18b8b1dc6ac651288cfffb20bee1a447632997a1 # v0.0.16
    - name: build + cache (jupitertwo)
      if: success() || failure()
      run: |
        nix build -L --keep-going \
          .#toplevels.jupitertwo
    - name: build + cache (riscv64 installer)
      if: success() || failure()
      run: |
        nix build -L --keep-going \
          .#extra.riscv64-linux.installer
